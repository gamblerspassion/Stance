name: SIGNAL Market Engine (gamblerspassion)
on:
  push:
    branches: [signal-market-engine-ci-20261025]
    paths:
      - 'signal-engine/**'
      - '.github/workflows/signal-market-engine-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout actual gamblerspassion branch
        uses: actions/checkout@v4
      - name: Prepare Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unpack national snapshot and validate archive checksum
        working-directory: signal-engine
        run: python3 scripts/unpack_snapshot.py
      - name: Audit national markets and existing website routes
        working-directory: signal-engine
        run: python3 scripts/audit_snapshot.py
      - name: Run backend unit and API integration tests
        working-directory: signal-engine
        run: npm test
      - name: Prove full national inventory, endpoints and performance
        working-directory: signal-engine
        run: node scripts/prove_engine.mjs
      - name: Upload proof reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-proof-${{ github.run_id }}
          path: signal-engine/proof-output/
          if-no-files-found: warn
